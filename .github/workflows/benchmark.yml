name: Benchmark free exchange rate APIs
on:
  schedule:
    - cron: '13 * * * *'   # hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency: benchmark
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/benchmark.mjs
      - name: Commit results
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add benchmark
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "benchmark: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 10; done
