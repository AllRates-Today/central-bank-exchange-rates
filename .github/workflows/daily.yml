name: Refresh rates
on:
  schedule:
    - cron: '20 3,9,15,21 * * *'   # four times a day; sources publish across all time zones
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "rates: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Mirror to Hugging Face
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python scripts/hf_sync.py
      - name: Mirror to Kaggle
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle six
          python scripts/kaggle_sync.py
