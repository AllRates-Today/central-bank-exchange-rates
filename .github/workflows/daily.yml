name: Refresh rates
on:
  schedule:
    - cron: '20 3,9,15,21 * * *'   # four times a day; sources publish across all time zones
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/store   # data/ in this repo only holds the 'moved' notices
    steps:
      - uses: actions/checkout@v4
      # Since 2026-11-23 the data lives in a private store repo, not here: the
      # owner wants everyone who uses the tables to register (API key or the
      # gated Hugging Face dataset). This repo keeps the scripts and README.
      - uses: actions/checkout@v4
        with:
          repository: AllRates-Today/central-bank-rates-store
          ssh-key: ${{ secrets.STORE_DEPLOY_KEY }}
          path: store
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update.mjs
        env:
          ALLRATES_API_KEY: ${{ secrets.ALLRATES_API_KEY }}
      - name: Commit if anything changed
        run: |
          cd store
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "rates: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Mirror to Hugging Face
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        # Non-fatal: HF upload 403s until HF_TOKEN is an org-scoped token
        # (AllRatesToday org). Kaggle below must still run meanwhile.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          cd scripts && python hf_sync.py
      - name: Mirror to Kaggle
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle six
          cd scripts && python kaggle_sync.py
